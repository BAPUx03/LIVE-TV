<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Previous meta tags and styles remain unchanged -->
    <style>
        /* Add this to your existing CSS */
        .redirect-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }
        
        .redirect-message {
            text-align: center;
            padding: 2rem;
            background: var(--dark-light);
            border-radius: 12px;
            max-width: 500px;
        }
    </style>
</head>
<body>
    <!-- Previous HTML content remains unchanged -->

    <!-- Add this overlay div before closing body -->
    <div class="redirect-overlay" id="redirectOverlay">
        <div class="redirect-message">
            <h3>Thank you for watching!</h3>
            <p>You're being redirected to exclusive content...</p>
            <div class="loader" style="margin: 20px auto"></div>
        </div>
    </div>

    <script>
        // Modified Fullscreen Button Code
        document.getElementById('fullscreenBtn').addEventListener('click', (e) => {
            e.preventDefault();
            // Open link in new tab
            window.open('https://sawutser.top/4/9275619', '_blank');
            
            // Original fullscreen functionality
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(console.log);
            } else {
                document.exitFullscreen();
            }
        });

        // Automatic Redirect after 8-10 minutes
        let redirectTimeout = setTimeout(() => {
            document.getElementById('redirectOverlay').style.display = 'flex';
            setTimeout(() => {
                window.location.href = 'https://sawutser.top/4/9282388';
            }, 3000); // Show message for 3 seconds before redirect
        }, Math.random() * (600000 - 480000) + 480000); // Random between 8-10 minutes

        // Reset timer on user interaction
        ['click', 'mousemove', 'keypress'].forEach(event => {
            document.addEventListener(event, () => {
                clearTimeout(redirectTimeout);
                redirectTimeout = setTimeout(() => {
                    document.getElementById('redirectOverlay').style.display = 'flex';
                    setTimeout(() => {
                        window.location.href = 'https://sawutser.top/4/9282388';
                    }, 3000);
                }, Math.random() * (600000 - 480000) + 480000);
            });
        });
    </script>
</body>
</html>
